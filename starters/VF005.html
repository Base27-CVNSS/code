<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Chat UI — Giao diện hội thoại</title><style>body{font:16px/1.6 Arial;margin:0;background:#f3f6ee;color:#264633}main{max-width:900px;margin:40px auto;padding:25px}button,input,textarea{font:inherit;padding:10px;border:1px solid #b5c5ac;border-radius:5px}button{background:#76ac29;color:white;cursor:pointer}section{background:white;padding:25px;border-radius:10px}small{color:#75826b}</style><main><small>VIETFLEX CODE / MIT STARTER</small><h1>AI Chat UI — Giao diện hội thoại</h1><section><p>Demo giao diện, phản hồi theo quy tắc cố định. Không kết nối mô hình AI.</p><div id="messages" aria-live="polite"></div><form id="form"><input id="text" required maxlength="500" placeholder="Nhập tin nhắn" aria-label="Tin nhắn"><button>Gửi</button></form></section><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#text'),box=document.querySelector('#messages');for(const t of ['Bạn: '+input.value,'Trợ lý mẫu: Tôi đã nhận tin nhắn. Để có AI thật, kết nối API thông qua backend bảo vệ khóa bí mật.']){const p=document.createElement('p');p.textContent=t;box.append(p)}input.value=''};</script><p><small>© 2026 Vietflex Code · MIT · Starter minh họa, không có backend.</small></p></main></html>
