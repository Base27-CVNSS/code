<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGIS Starter — Điểm thực địa</title><style>body{font:16px/1.6 Arial;margin:0;background:#f3f6ee;color:#264633}main{max-width:900px;margin:40px auto;padding:25px}button,input,textarea{font:inherit;padding:10px;border:1px solid #b5c5ac;border-radius:5px}button{background:#76ac29;color:white;cursor:pointer}section{background:white;padding:25px;border-radius:10px}small{color:#75826b}</style><main><small>VIETFLEX CODE / MIT STARTER</small><h1>WebGIS Starter — Điểm thực địa</h1><section><p>Sơ đồ tọa độ minh họa (không phải bản đồ nền). Nhập kinh độ/vĩ độ để đánh dấu.</p><input id="lon" type="number" min="-180" max="180" value="106.7" step="any" aria-label="Kinh độ"><input id="lat" type="number" min="-90" max="90" value="10.8" step="any" aria-label="Vĩ độ"><button id="add">Thêm điểm</button><button id="export">Xuất GeoJSON</button><p id="msg" role="status"></p><svg id="map" viewBox="0 0 720 360" style="width:100%;background:#e6efdf"><path d="M0 180H720M360 0V360" stroke="#a0b68e"/><text x="8" y="20" fill="#698359">Toàn cầu: X = kinh độ, Y = vĩ độ</text></svg></section><script>const points=[];const lon=document.querySelector('#lon'),lat=document.querySelector('#lat'),map=document.querySelector('#map'),msg=document.querySelector('#msg');document.querySelector('#add').onclick=()=>{if(!lon.value||!lat.value)return;const x=Number(lon.value),y=Number(lat.value);if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(x)>180||Math.abs(y)>90){msg.textContent='Tọa độ không hợp lệ';return}points.push([x,y]);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',(x+180)*2);c.setAttribute('cy',(90-y)*2);c.setAttribute('r',4);c.setAttribute('fill','#f88a22');map.append(c);msg.textContent=points.length+' điểm';};document.querySelector('#export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({type:'FeatureCollection',features:points.map((coordinates,i)=>({type:'Feature',properties:{id:i+1},geometry:{type:'Point',coordinates}}))})],{type:'application/geo+json'}));a.href=u;a.download='points.geojson';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script><p><small>© 2026 Vietflex Code · MIT · Starter minh họa, không có backend.</small></p></main></html>
